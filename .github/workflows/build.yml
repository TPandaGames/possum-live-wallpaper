name: Build screensaver

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish PocketPossum.csproj -c Release -o dist

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = ([xml](Get-Content PocketPossum.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          & $iscc "/DAppVersion=$version" installer\PocketPossum.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Upload .scr
        uses: actions/upload-artifact@v4
        with:
          name: PocketPossum-scr
          path: |
            dist/PocketPossum.scr
            dist/PocketPossum.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PocketPossum-installer
          path: installer/Output/*.exe

  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb
        run: bash linux/build-deb.sh dist

      - name: Check package
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb

      - name: Install it on a clean runner and run it
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ./dist/*.deb xvfb
          pocket-possum --version
          xvfb-run -a env WEBKIT_DISABLE_COMPOSITING_MODE=1 POSSUM_SOFTWARE=1 pocket-possum --screenshot "$PWD/shot.png" --delay 4000
          test -s shot.png

      - uses: actions/upload-artifact@v4
        with:
          name: PocketPossum-deb
          path: dist/*.deb
