name: Build screensaver

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish PocketPossum.csproj -c Release -o dist

      - name: Upload .scr
        uses: actions/upload-artifact@v4
        with:
          name: PocketPossum-scr
          path: |
            dist/PocketPossum.scr
            dist/PocketPossum.exe
